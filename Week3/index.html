<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <div class="container">

        <h1>🤖 AI Smart Task Planner</h1>

        <p class="subtitle">
            Enter your goal and let Gemini AI generate a step-by-step plan.
        </p>
    
        <!-- AI Goal Section -->
        <div class="goal-section">
    
            <input
                type="text"
                id="goalInput"
                placeholder="Enter your goal (e.g. Plan a trip to Goa)">
    
            <button type="button" id="generatePlanBtn">
                Generate AI Plan
            </button>
    
        </div>
    
        <p id="status"></p>
    
        <hr>
    
        <!-- Existing Task Manager -->
    
        <form autocomplete="off">
    
            <div class="input-section">
    
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task"
                    autocomplete="off">
    
                <button type="button" id="addTaskBtn">
                    Add Task
                </button>
    
            </div>
    
        </form>
    
        <p id="message"></p>
    
        <ul id="taskList"></ul>
    
    </div>

    <script src="script.js"></script>

</body>

</html>
